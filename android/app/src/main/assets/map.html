<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>附近接种门诊</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f6f5fb; font-family:-apple-system,"PingFang SC",sans-serif; }
  #map { width:100%; height:100%; }
  #tip {
    position:absolute; left:12px; right:12px; top:12px; z-index:20;
    background:rgba(255,255,255,.94); border-radius:12px; padding:9px 12px;
    font-size:12.5px; color:#6b6b7b; box-shadow:0 2px 10px rgba(0,0,0,.08); display:none;
  }
  #fail {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; padding:24px; text-align:center; background:#f6f5fb; z-index:30;
  }
  #fail h3 { font-size:15px; color:#2b2b38; margin:0 0 8px; }
  #fail p { font-size:12.5px; color:#8a8a99; margin:0 0 16px; line-height:1.6; }
  #fail button {
    border:none; background:#7c6cf0; color:#fff; font-size:14px; font-weight:600;
    padding:11px 22px; border-radius:999px;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="tip"></div>
<div id="fail">
  <h3>地图加载失败</h3>
  <p>当前网络无法加载高德地图，已切换为列表模式。<br>下方仍可按距离查看附近接种门诊。</p>
  <button onclick="android.mapFallback()">用列表查看</button>
</div>
<script src="https://webapi.amap.com/maps?v=1.4.15&key=5c7f2a3500ac27e76034ed8b9225f344&plugin=AMap.Geolocation,AMap.Scale,AMap.ToolBar"></script>
<script>
var map = null, geoloc = null, markers = [], ready = false, readySent = false;

function showTip(text, ms) {
  var t = document.getElementById('tip');
  t.textContent = text;
  t.style.display = 'block';
  if (ms) setTimeout(function () { t.style.display = 'none'; }, ms);
}

function fail(msg) {
  document.getElementById('fail').style.display = 'flex';
  try { if (window.android && android.mapFallback) android.mapFallback(); } catch (e) {}
}

function boot() {
  if (typeof AMap === 'undefined') { fail('AMap undefined'); return; }
  try {
    map = new AMap.Map('map', {
      zoom: 13,
      resizeEnable: true,
      center: [113.325, 23.135]
    });
    map.addControl(new AMap.Scale());
    ready = true;
    if (!readySent) { readySent = true; try { android.mapReady(); } catch (e) {} }
  } catch (e) {
    fail('map init: ' + e.message);
  }
}

/* Kotlin 注入：把门诊点画到地图上 */
function renderClinics(json, myLat, myLng) {
  if (!ready) { setTimeout(function () { renderClinics(json, myLat, myLng); }, 300); return; }
  var list;
  try { list = JSON.parse(json); } catch (e) { return; }

  for (var i = 0; i < markers.length; i++) { map.remove(markers[i]); }
  markers = [];

  for (var j = 0; j < list.length; j++) {
    (function (c) {
      var m = new AMap.Marker({
        position: [c.lng, c.lat],
        title: c.name,
        map: map
      });
      m.on('click', function () {
        showTip(c.name + ' · ' + (c.distance || '') + (c.distance ? 'km' : ''));
        try { android.pickClinic(c.name, c.lat, c.lng); } catch (e) {}
      });
      markers.push(m);
    })(list[j]);
  }

  if (myLat && myLng) {
    var me = new AMap.Marker({
      position: [myLng, myLat],
      map: map,
      content: '<div style="width:14px;height:14px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 3px rgba(59,130,246,.25)"></div>',
      offset: new AMap.Pixel(-7, -7),
      zIndex: 200
    });
    markers.push(me);
    map.setCenter([myLng, myLat]);
    map.setZoom(13);
  }

  if (markers.length > 1) {
    try { map.setFitView(markers); } catch (e) {}
  }
}

/* 定位：使用 WebView 的 geolocation（Kotlin 侧已放行并桥接系统定位） */
function locate() {
  if (typeof AMap === 'undefined' || !ready) { return; }
  geoloc = new AMap.Geolocation({
    enableHighAccuracy: true,
    timeout: 12000,
    zoomToAccuracy: false,
    showButton: false,
    showMarker: false,
    panToLocation: false
  });
  geoloc.getCurrentPosition(function (status, result) {
    if (status === 'complete' && result && result.position) {
      var lng = result.position.getLng(), lat = result.position.getLat();
      showTip('定位成功', 1800);
      try { android.onLocated(lat, lng); } catch (e) {}
    } else {
      showTip('定位失败，默认显示广州天河，可在下方列表按距离查看', 4000);
      try { android.onLocateFailed(); } catch (e) {}
    }
  });
}

window.onload = function () {
  boot();
  // 8 秒内地图没起来就降级
  setTimeout(function () {
    if (!ready) fail('timeout');
  }, 8000);
  setTimeout(locate, 1200);
};
</script>
</body>
</html>
