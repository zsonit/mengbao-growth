name: MengBao
options:
  bundleIdPrefix: com.zsonit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "2.10.14"
    CURRENT_PROJECT_VERSION: "52"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_MODULE_VERIFIER: NO

targets:
  MengBao:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MengBao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zsonit.mengbao
        PRODUCT_NAME: MengBao
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Support/Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        ENABLE_BITCODE: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 萌宝成长
        CFBundleName: MengBao
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: 用于把生长曲线图保存到相册，方便发给医生或家人。
        NSMicrophoneUsageDescription: 用于语音记录喂养、睡眠、体温等信息，你说一句就自动填好表单；录音不保存、不上传。
        NSSpeechRecognitionUsageDescription: 用于把你说的话在手机本地转成文字，再自动识别成记录；语音内容不上传服务器。
        NSLocationWhenInUseUsageDescription: 用于在地图上显示你身边最近的预防接种门诊并计算距离；位置只在本机使用，不会上传或保存。
        NSLocationAlwaysAndWhenInUseUsageDescription: 用于在地图上显示你身边最近的预防接种门诊并计算距离；位置只在本机使用，不会上传或保存。
        AMapIOSKey: 5894f3adbdce48b2d6f35afcd8564966
        AMapWebKey: 5c7f2a3500ac27e76034ed8b9225f344
        LSApplicationQueriesSchemes:
          - iosamap
          - amapuri
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

schemes:
  MengBao:
    build:
      targets:
        MengBao: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
