name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "MengBao/**"
      - "Support/**"
      - "Podfile"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA (macOS)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        run: |
          pod install --repo-update 2>&1 | tail -40
          ls -la

      - name: Build (unsigned, iphoneos)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MengBao.xcworkspace \
            -scheme MengBao \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build | tee build.log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/MengBao.app"
          test -d "$APP" || { echo "App bundle not found"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "MengBao-unsigned.ipa" Payload
          unzip -l "MengBao-unsigned.ipa" | head -20
          ls -lh "MengBao-unsigned.ipa"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MengBao-ipa-unsigned
          path: MengBao-unsigned.ipa
          if-no-files-found: error

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MengBao-unsigned.ipa
